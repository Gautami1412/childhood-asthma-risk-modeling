<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="620" height="520" fill="white"/>
  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3a5f">Test-set confusion matrix (logistic regression)</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#555">High specificity; missed cases motivate threshold tuning</text>

  <!-- column header: Actual -->
  <text x="360" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Actual</text>
  <text x="260" y="106" text-anchor="middle" font-size="12" fill="#333">No asthma</text>
  <text x="460" y="106" text-anchor="middle" font-size="12" fill="#333">Asthma</text>

  <!-- row header: Predicted -->
  <text x="36" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#222" transform="rotate(-90 36 285)">Predicted</text>
  <text x="150" y="200" text-anchor="end" font-size="12" fill="#333">No asthma</text>
  <text x="150" y="370" text-anchor="end" font-size="12" fill="#333">Asthma</text>

  <!-- cells -->
  <!-- TN -->
  <rect x="160" y="115" width="200" height="170" fill="#1f3a5f"/>
  <text x="260" y="195" text-anchor="middle" font-size="30" font-weight="bold" fill="white">5,499</text>
  <text x="260" y="222" text-anchor="middle" font-size="13" fill="#d7e2ee">True Negative</text>
  <!-- FN -->
  <rect x="360" y="115" width="200" height="170" fill="#bcd2e8"/>
  <text x="460" y="195" text-anchor="middle" font-size="30" font-weight="bold" fill="#1f3a5f">474</text>
  <text x="460" y="222" text-anchor="middle" font-size="13" fill="#33506e">False Negative</text>
  <!-- FP -->
  <rect x="160" y="285" width="200" height="170" fill="#e1ebf5"/>
  <text x="260" y="365" text-anchor="middle" font-size="30" font-weight="bold" fill="#1f3a5f">112</text>
  <text x="260" y="392" text-anchor="middle" font-size="13" fill="#33506e">False Positive</text>
  <!-- TP -->
  <rect x="360" y="285" width="200" height="170" fill="#8fb3d6"/>
  <text x="460" y="365" text-anchor="middle" font-size="30" font-weight="bold" fill="#1f3a5f">327</text>
  <text x="460" y="392" text-anchor="middle" font-size="13" fill="#23415f">True Positive</text>

  <!-- grid lines -->
  <g stroke="white" stroke-width="3">
    <line x1="360" y1="115" x2="360" y2="455"/>
    <line x1="160" y1="285" x2="560" y2="285"/>
  </g>
  <rect x="160" y="115" width="400" height="340" fill="none" stroke="#444" stroke-width="1"/>

  <text x="360" y="490" text-anchor="middle" font-size="11" fill="#777">Test set n = 6,412  •  asthma is a minority class (~12%)</text>
</svg>
