<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="920" height="470" fill="white"/>
  <text x="460" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f3a5f">21 predictors across four risk domains  •  outcome: childhood asthma diagnosis (2017 NSCH)</text>

  <!-- Column 1: Demographic (navy) -->
  <g>
    <rect x="12" y="56" width="210" height="40" rx="4" fill="#1f3a5f"/>
    <text x="117" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Demographic</text>
    <g font-size="12" fill="#222" text-anchor="middle">
      <rect x="12" y="104" width="210" height="38" rx="3" fill="#1f3a5f" fill-opacity="0.12"/><text x="117" y="127">Age</text>
      <rect x="12" y="148" width="210" height="38" rx="3" fill="#1f3a5f" fill-opacity="0.12"/><text x="117" y="171">Sex</text>
      <rect x="12" y="192" width="210" height="38" rx="3" fill="#1f3a5f" fill-opacity="0.12"/><text x="117" y="215">Race / ethnicity</text>
      <rect x="12" y="236" width="210" height="38" rx="3" fill="#1f3a5f" fill-opacity="0.12"/><text x="117" y="259">Household language</text>
    </g>
  </g>

  <!-- Column 2: Clinical / health (teal) -->
  <g>
    <rect x="237" y="56" width="210" height="40" rx="4" fill="#2a9d8f"/>
    <text x="342" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Clinical / health</text>
    <g font-size="12" fill="#222" text-anchor="middle">
      <rect x="237" y="104" width="210" height="38" rx="3" fill="#2a9d8f" fill-opacity="0.14"/><text x="342" y="127">Allergies</text>
      <rect x="237" y="148" width="210" height="38" rx="3" fill="#2a9d8f" fill-opacity="0.14"/><text x="342" y="171">Breathing problems</text>
      <rect x="237" y="192" width="210" height="38" rx="3" fill="#2a9d8f" fill-opacity="0.14"/><text x="342" y="215">BMI class</text>
      <rect x="237" y="236" width="210" height="38" rx="3" fill="#2a9d8f" fill-opacity="0.14"/><text x="342" y="259">Physical activity</text>
      <rect x="237" y="280" width="210" height="38" rx="3" fill="#2a9d8f" fill-opacity="0.14"/><text x="342" y="303">Hours of sleep</text>
      <rect x="237" y="324" width="210" height="38" rx="3" fill="#2a9d8f" fill-opacity="0.14"/><text x="342" y="347">Insurance coverage</text>
    </g>
  </g>

  <!-- Column 3: Environmental (coral) -->
  <g>
    <rect x="462" y="56" width="210" height="40" rx="4" fill="#e76f51"/>
    <text x="567" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Environmental</text>
    <g font-size="12" fill="#222" text-anchor="middle">
      <rect x="462" y="104" width="210" height="38" rx="3" fill="#e76f51" fill-opacity="0.14"/><text x="567" y="127">Mold exposure</text>
      <rect x="462" y="148" width="210" height="38" rx="3" fill="#e76f51" fill-opacity="0.14"/><text x="567" y="171">Metro / urban status</text>
      <rect x="462" y="192" width="210" height="38" rx="3" fill="#e76f51" fill-opacity="0.14"/><text x="567" y="215">Neighborhood support</text>
      <rect x="462" y="236" width="210" height="38" rx="3" fill="#e76f51" fill-opacity="0.14"/><text x="567" y="259">Neighborhood safety</text>
    </g>
  </g>

  <!-- Column 4: Socioeconomic (amber) -->
  <g>
    <rect x="687" y="56" width="210" height="40" rx="4" fill="#d9a818"/>
    <text x="792" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Socioeconomic</text>
    <g font-size="12" fill="#222" text-anchor="middle">
      <rect x="687" y="104" width="210" height="38" rx="3" fill="#e9c46a" fill-opacity="0.30"/><text x="792" y="127">Federal poverty level</text>
      <rect x="687" y="148" width="210" height="38" rx="3" fill="#e9c46a" fill-opacity="0.30"/><text x="792" y="171">Family size</text>
      <rect x="687" y="192" width="210" height="38" rx="3" fill="#e9c46a" fill-opacity="0.30"/><text x="792" y="215">Food situation</text>
      <rect x="687" y="236" width="210" height="38" rx="3" fill="#e9c46a" fill-opacity="0.30"/><text x="792" y="259">Healthcare access</text>
    </g>
  </g>
</svg>
